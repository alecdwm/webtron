services:
  main:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3
        COPY webtron /bin/webtron
        EXPOSE 3000
        CMD /bin/webtron -b 0.0.0.0
    image: webtron
    ports:
      - 3000:3000
    environment:
      - LEADERBOARD_PATH=/data/leaderboard.jsonl
      # Optional: uncomment to post to an ntfy topic when players connect,
      # rename or leave. Leave a line commented out rather than empty, since
      # the server rejects an empty url.
      # - NTFY_URL=https://ntfy.example.org/webtron
      # - PUBLIC_URL=https://webtron.example.org/
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    restart: unless-stopped

volumes:
  data:
