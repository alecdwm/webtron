[package]
name = "webtron"
description = "A browser-based multiplayer implementation of the classic Tron Lightcycles arcade game."
version = "2.0.0"
authors = ["alecdwm <alec@owls.io>"]
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
euclid = { version = "0.22", features = ["serde"] }
futures = "0.3.34"
getrandom = { version = "0.4", features = ["sys_rng"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
log = "0.4.34"
lyon_geom = "1"
mime_guess = "2.0.5"
pretty_env_logger = "0.5"
quit = "2"
rand_core = "0.10"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
tokio-tungstenite = "0.30"
uuid = { version = "1", features = ["v4", "serde"] }
warp = { version = "0.4", features = ["server", "websocket"] }
